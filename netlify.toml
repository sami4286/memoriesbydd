# Netlify builds from the repo root but publishes ONLY _deploy/.
#
# WHY THIS MATTERS — do not change `publish` back to "." or to the repo root.
# When the whole repo was published, these were live and readable by anyone:
#   /_archive/audit/AUDIT.md              -> 200
#   /_strategy/05-CLIENT-ACTIONS.md       -> 200
# That is confidential client material: commercial assessment of Ashley's
# business, competitor pricing, partner funeral directors by name, and family
# names. The X-Robots-Tag below keeps it out of search results but does nothing
# to stop a person — or a crawler that ignores the header — reading it directly.
# Confirmed exposed and closed 24 Aug 2026.
#
# Working documents (_archive, _strategy, _design, _copy, _src) must never be
# deployed. Anything that should be public goes in _deploy/.

[build]
  command = "npm run build"
  publish = "_deploy"

[build.environment]
  NODE_VERSION = "22.14.0"

# Private client preview — keep it out of search engines and AI crawlers.
# REMOVE ONLY ON ASHLEY'S SIGN-OFF. Dropping X-Robots-Tag while the site still
# carries placeholder testimonials and unconfirmed opening hours would index
# copy we have flagged as provisional.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; media-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The old build emitted flat .html files. The build now emits directory URLs,
# which is what the nav and footer have always linked to. Carry the old paths
# across rather than serving both.
[[redirects]]
  from = "/order.html"
  to = "/order/"
  status = 301

[[redirects]]
  from = "/our-products.html"
  to = "/our-products/"
  status = 301

[[redirects]]
  from = "/how-it-works.html"
  to = "/how-it-works/"
  status = 301

[[redirects]]
  from = "/price-list.html"
  to = "/price-list/"
  status = 301

[[redirects]]
  from = "/catalogue/*"
  to = "/gallery/:splat"
  status = 301

[[redirects]]
  from = "/menu/:slug/"
  to = "/gallery/:slug/"
  status = 301
